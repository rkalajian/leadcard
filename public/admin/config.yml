# Decap CMS configuration.
#
# Auth is Netlify Identity + Git Gateway: the editor logs in at /admin/, Decap
# commits straight back to this repo, and Netlify rebuilds the site. Enable
# Identity (invite-only) and Git Gateway in the Netlify site dashboard first —
# see README.md.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'content: update {{collection}} “{{slug}}”'
    openAuthoring: 'content: update {{collection}} “{{slug}}” ({{author-login}})'

# Lets `npm run cms:proxy` serve the CMS against local files during development.
# Ignored on any non-localhost host, so it is safe to leave enabled.
local_backend: true

media_folder: public/media
public_folder: /media

publish_mode: simple

collections:
  - name: site
    label: Site
    label_singular: Site
    description: Everything on the microsite — copy, colours, fonts, form fields and analytics.
    files:
      - name: settings
        label: Site content & design
        file: src/data/site.yml
        description: The single source of truth for this microsite.
        fields:
          # ------------------------------------------------------------------
          - name: brand
            label: Brand & page header
            widget: object
            fields:
              - name: lang
                label: Page language
                widget: select
                default: en
                options:
                  - { label: English, value: en }
                  - { label: 'English (US)', value: en-US }
                  - { label: 'English (UK)', value: en-GB }
                  - { label: Spanish, value: es }
                  - { label: French, value: fr }
                  - { label: German, value: de }
                  - { label: Portuguese, value: pt }
                hint: Tells screen readers which pronunciation to use.
              - { name: siteTitle, label: Business name, widget: string }
              - {
                  name: headline,
                  label: Headline,
                  widget: string,
                  hint: The main promise at the top of the page.,
                }
              - { name: subheadline, label: Sub-headline, widget: string, required: false }
              - {
                  name: metaDescription,
                  label: Search-result description,
                  widget: text,
                  required: false,
                  hint: Shown by Google under the page title. Aim for 150 characters.,
                }
              - {
                  name: logo,
                  label: Logo,
                  widget: image,
                  required: false,
                  allow_multiple: false,
                }
              - {
                  name: logoAlt,
                  label: Logo alt text,
                  widget: string,
                  required: false,
                  hint: 'Describe the logo for screen readers, e.g. “Northwind Roofing”. Leave blank only if the business name appears next to it.',
                }

          # ------------------------------------------------------------------
          - name: theme
            label: Colours & fonts
            widget: object
            collapsed: true
            fields:
              - name: headingFont
                label: Heading font
                widget: select
                default: Sora
                options:
                  - Inter
                  - Sora
                  - Manrope
                  - Poppins
                  - Montserrat
                  - Playfair Display
                  - Merriweather
                  - Source Serif 4
                  - Space Grotesk
                  - DM Sans
              - name: bodyFont
                label: Body font
                widget: select
                default: Inter
                options:
                  - Inter
                  - Sora
                  - Manrope
                  - Poppins
                  - Montserrat
                  - Merriweather
                  - Source Serif 4
                  - Space Grotesk
                  - DM Sans
                  - Nunito Sans
              - {
                  name: colorBg,
                  label: Page background,
                  widget: color,
                  default: '#0B1120',
                  enableAlpha: false,
                }
              - {
                  name: colorSurface,
                  label: Panel background,
                  widget: color,
                  default: '#151E33',
                  enableAlpha: false,
                }
              - {
                  name: colorText,
                  label: Body text,
                  widget: color,
                  default: '#F4F7FF',
                  enableAlpha: false,
                  hint: Must contrast strongly with the panel background. The build automatically substitutes a readable colour (and logs a warning) if it does not.,
                }
              - {
                  name: colorMuted,
                  label: Secondary text,
                  widget: color,
                  default: '#C3CCE4',
                  enableAlpha: false,
                }
              - {
                  name: colorPrimary,
                  label: Button colour,
                  widget: color,
                  default: '#2563EB',
                  enableAlpha: false,
                }
              - {
                  name: colorPrimaryText,
                  label: Button text colour,
                  widget: color,
                  default: '#FFFFFF',
                  enableAlpha: false,
                }
              - {
                  name: colorAccent,
                  label: Accent / highlight,
                  widget: color,
                  default: '#7DD3FC',
                  enableAlpha: false,
                }
              - {
                  name: overlayOpacity,
                  label: Default background tint strength,
                  widget: number,
                  value_type: float,
                  default: 0.68,
                  min: 0.45,
                  max: 0.95,
                  step: 0.01,
                  hint: How much the panel background image/video is darkened so text stays readable. Higher = more readable.,
                }

          # ------------------------------------------------------------------
          - name: analytics
            label: Analytics (optional)
            widget: object
            collapsed: true
            required: false
            fields:
              - {
                  name: ga4Id,
                  label: Google Analytics 4 measurement ID,
                  widget: string,
                  required: false,
                  pattern: ['^$|^G-[A-Za-z0-9]{4,20}$', 'Must look like G-XXXXXXXXXX, or be left empty.'],
                  hint: Leave blank if you do not use GA4.,
                }
              - {
                  name: gtmId,
                  label: Google Tag Manager container ID,
                  widget: string,
                  required: false,
                  pattern: ['^$|^GTM-[A-Za-z0-9]{4,20}$', 'Must look like GTM-XXXXXX, or be left empty.'],
                  hint: Leave blank if you do not use GTM.,
                }

          # ------------------------------------------------------------------
          - name: form
            label: Enquiry form (panel 1)
            widget: object
            collapsed: true
            fields:
              - { name: submitLabel, label: Button text, widget: string, default: Send }
              - {
                  name: helpText,
                  label: Text under the button,
                  widget: string,
                  required: false,
                }
              - {
                  name: requiredNote,
                  label: Required-fields note,
                  widget: string,
                  default: Fields marked with an asterisk are required.,
                }
              - {
                  name: successHeading,
                  label: Thank-you heading,
                  widget: string,
                  default: Thanks — we got it.,
                }
              - {
                  name: successBody,
                  label: Thank-you message,
                  widget: text,
                  default: We will be in touch shortly.,
                }
              - name: fields
                label: Form fields
                label_singular: Form field
                widget: list
                min: 1
                summary: '{{fields.label}} ({{fields.type}})'
                fields:
                  - {
                      name: label,
                      label: Question / label,
                      widget: string,
                      hint: Always visible above the box — this is what screen readers announce.,
                    }
                  - {
                      name: name,
                      label: Field ID,
                      widget: string,
                      pattern: ['^[a-zA-Z0-9_-]+$', 'Letters, numbers, hyphens and underscores only.'],
                      hint: Appears as the column name in your Netlify form submissions. No spaces.,
                    }
                  - name: type
                    label: Field type
                    widget: select
                    default: text
                    options:
                      - { label: Short text, value: text }
                      - { label: Email address, value: email }
                      - { label: Phone number, value: tel }
                      - { label: Website address, value: url }
                      - { label: Number, value: number }
                      - { label: Long message, value: textarea }
                  - name: autocomplete
                    label: Autofill hint
                    widget: select
                    required: false
                    default: ''
                    options:
                      - { label: 'None', value: '' }
                      - { label: Full name, value: name }
                      - { label: Email, value: email }
                      - { label: Phone, value: tel }
                      - { label: Street address, value: street-address }
                      - { label: Postcode / ZIP, value: postal-code }
                      - { label: Organisation, value: organization }
                    hint: Lets browsers fill the field in for the visitor (accessibility requirement 1.3.5).
                  - { name: required, label: Required?, widget: boolean, default: false }
                  - {
                      name: placeholder,
                      label: Placeholder,
                      widget: string,
                      required: false,
                      hint: Optional example text. Never put the question itself here — use the label.,
                    }

          # ------------------------------------------------------------------
          - name: panels
            label: Panels
            label_singular: Panel
            widget: list
            min: 1
            max: 3
            collapsed: true
            summary: '{{fields.title}}'
            hint: Three panels maximum. The first panel is the one that carries the enquiry form.
            fields:
              - {
                  name: key,
                  label: Panel ID,
                  widget: string,
                  pattern: ['^[a-zA-Z0-9-]+$', 'Letters, numbers and hyphens only.'],
                  hint: 'Used for in-page links, e.g. panel-1.',
                }
              - { name: eyebrow, label: Small label above the title, widget: string, required: false }
              - { name: title, label: Panel title, widget: string }
              - {
                  name: body,
                  label: Panel text,
                  widget: markdown,
                  required: false,
                  buttons: [bold, italic, link, bulleted-list, numbered-list, quote],
                  editor_components: [],
                }
              - {
                  name: showForm,
                  label: Show the enquiry form in this panel?,
                  widget: boolean,
                  default: false,
                  hint: Only one panel can hold the form. If more than one is ticked, the first wins.,
                }
              - { name: ctaLabel, label: Button text, widget: string, required: false }
              - {
                  name: ctaHref,
                  label: Button link,
                  widget: string,
                  required: false,
                  hint: 'A full URL, or #panel-1 to jump to the enquiry form.',
                }
              - name: background
                label: Panel background
                widget: object
                collapsed: true
                fields:
                  - name: type
                    label: Background type
                    widget: select
                    default: image
                    options:
                      - { label: 'Colour only', value: none }
                      - { label: Image, value: image }
                      - { label: Video, value: video }
                  - {
                      name: image,
                      label: Image,
                      widget: image,
                      required: false,
                      allow_multiple: false,
                    }
                  - {
                      name: alt,
                      label: Image description,
                      widget: string,
                      required: false,
                      hint: Leave blank if the background is purely decorative. Fill it in only if the image carries information the text does not.,
                    }
                  - {
                      name: video,
                      label: Video file (MP4),
                      widget: file,
                      required: false,
                      hint: Silent, short and looping works best. Keep it under about 3 MB.,
                    }
                  - {
                      name: poster,
                      label: Video still image,
                      widget: image,
                      required: false,
                      hint: Shown before the video loads, and instead of the video for visitors who have asked for reduced motion. Always set one.,
                    }
                  - name: focalPoint
                    label: Focus on
                    widget: select
                    default: center
                    options: [top, center, bottom]
                  - {
                      name: overlayOpacity,
                      label: Tint strength,
                      widget: number,
                      value_type: float,
                      default: 0.7,
                      min: 0.45,
                      max: 0.95,
                      step: 0.01,
                      required: false,
                    }

          # ------------------------------------------------------------------
          - name: footer
            label: Footer
            widget: object
            collapsed: true
            fields:
              - { name: legalName, label: Legal / trading name, widget: string, required: false }
              - { name: phone, label: Phone, widget: string, required: false }
              - { name: email, label: Email, widget: string, required: false }
              - { name: privacyUrl, label: Privacy policy URL, widget: string, required: false }
              - { name: note, label: Small print, widget: text, required: false }
