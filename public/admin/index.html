<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content manager</title>
    <!-- Netlify Identity widget: provides the login modal and the auth token
         that Git Gateway uses to commit on the editor's behalf. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS mounts itself into <body>. -->
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

    <script>
      // Standard redirect-after-login snippet: when an invited editor follows
      // their email link, drop them into the CMS instead of the public site.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
