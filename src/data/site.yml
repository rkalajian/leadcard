brand:
  lang: en
  siteTitle: Northwind Roofing
  headline: Storm damage? We handle the whole claim.
  subheadline: Free 20-minute inspection. No obligation, no pressure.
  metaDescription: Free roof inspection and full storm-damage claim support. Book
    in under a minute.
  logoAlt: ""
  logo: /media/secondary-logo-white-.webp
theme:
  colorBg: "#0B1120"
  colorMuted: "#C3CCE4"
  colorSurface: "#151E33"
  colorPrimaryText: "#FFFFFF"
  colorAccent: "#7DD3FC"
  colorText: "#F4F7FF"
  bodyFont: Inter
  headingFont: Sora
  overlayOpacity: 0.68
  colorPrimary: "#2563EB"
analytics:
  ga4Id: ""
  gtmId: ""
form:
  submitLabel: Request my free inspection
  helpText: We reply within one business day. We never sell your details.
  requiredNote: Fields marked with an asterisk are required.
  successHeading: Thanks — we got it.
  successBody: One of our inspectors will reach out within one business day.
  fields:
    - name: name
      label: Full name
      type: text
      autocomplete: name
      required: true
      placeholder: ""
    - name: email
      label: Email address
      type: email
      autocomplete: email
      required: true
      placeholder: ""
    - name: phone
      label: Phone number
      type: tel
      autocomplete: tel
      required: false
      placeholder: ""
    - name: message
      label: What happened to your roof?
      type: textarea
      autocomplete: ""
      required: false
      placeholder: ""
panels:
  - key: panel-1
    eyebrow: Step one
    title: Book your free inspection
    body: |
      Tell us where you are and what you are seeing. We will schedule a
      **20-minute inspection** at a time that suits you.
    showForm: true
    ctaLabel: ""
    ctaHref: ""
    background:
      type: video
      image: /media/panel-1.svg
      alt: ""
      video: /media/0_abstract_background_720x1280.mp4
      poster: ""
      overlayOpacity: 0.72
      focalPoint: center
  - key: panel-2
    eyebrow: Step two
    title: We document the damage
    body: |
      Our inspectors photograph every affected slope, log measurements, and
      build the evidence pack your insurer actually asks for.

      - Full photographic survey
      - Moisture and decking checks
      - Written summary within 24 hours
    showForm: false
    ctaLabel: See a sample report
    ctaHref: "#panel-1"
    background:
      type: image
      image: /media/panel-2.svg
      alt: ""
      video: ""
      poster: ""
      overlayOpacity: 0.7
      focalPoint: center
  - key: panel-3
    eyebrow: Step three
    title: We handle the claim end to end
    body: |
      You approve the scope, we deal with the adjuster. Most homeowners never
      have to make a second phone call.
    showForm: false
    ctaLabel: Start my claim
    ctaHref: "#panel-1"
    background:
      type: image
      image: /media/panel-3.svg
      alt: ""
      video: ""
      poster: ""
      overlayOpacity: 0.7
      focalPoint: center
footer:
  legalName: Northwind Roofing LLC
  phone: ""
